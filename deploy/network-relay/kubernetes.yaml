apiVersion: apps/v1
kind: Deployment
metadata:
  name: codelight-network-relay
  namespace: codelight
spec:
  # Connection routing is intentionally ephemeral and local to this one instance.
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: codelight-network-relay}}
  template:
    metadata: {labels: {app: codelight-network-relay}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: network
          image: docker.io/library/codelight-network-relay:RELEASE_TAG
          imagePullPolicy: Never
          env:
            - name: REGISTRATION_TOKEN
              valueFrom: {secretKeyRef: {name: codelight-network-registration, key: token}}
          ports: [{name: http, containerPort: 8081}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 2}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: codelight-network-relay, namespace: codelight}
spec:
  type: ClusterIP
  selector: {app: codelight-network-relay}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codelight-network-relay
  namespace: codelight
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls: [{hosts: [relay.example.com], secretName: codelight-network-tls}]
  rules:
    - host: relay.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: codelight-network-relay, port: {name: http}}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: network-relay-only, namespace: codelight}
spec:
  podSelector: {matchLabels: {app: codelight-network-relay}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
          podSelector: {matchLabels: {app.kubernetes.io/name: ingress-nginx}}
      ports: [{protocol: TCP, port: 8081}]
  egress: []

apiVersion: apps/v1
kind: Deployment
metadata:
  name: codelight-website
  namespace: codelight
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: codelight-website}
  template:
    metadata:
      labels: {app: codelight-website}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: website
          image: docker.io/library/codelight-website:RELEASE_TAG
          imagePullPolicy: Never
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
          volumeMounts: [{name: temporary, mountPath: /tmp}]
      volumes: [{name: temporary, emptyDir: {sizeLimit: 32Mi}}]
---
apiVersion: v1
kind: Service
metadata:
  name: codelight-website
  namespace: codelight
spec:
  type: ClusterIP
  selector: {app: codelight-website}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codelight-website
  namespace: codelight
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [codelight.novarock.io]
      secretName: codelight-tls
  rules:
    - host: codelight.novarock.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: codelight-website
                port: {name: http}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: static-website-only
  namespace: codelight
spec:
  podSelector: {matchLabels: {app: codelight-website}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
          podSelector:
            matchLabels: {app.kubernetes.io/name: ingress-nginx}
      ports: [{protocol: TCP, port: 8080}]
  egress: []
